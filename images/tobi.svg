<svg xmlns="http://www.w3.org/2000/svg"
	 viewBox="0 0 72 72"
	 width="140"
	 height="140"
	 role="img"
	 aria-labelledby="title">
	<title id="title">Tobi the turtle</title>

<g stroke="#000" stroke-width="2"
   stroke-linecap="round" stroke-linejoin="round">
	<!-- Arms -->
	<ellipse cx="15" cy="48" rx="4.5" ry="6.5"
		  transform="rotate(25 15 48)" fill="#B1CC33"/>
	<ellipse cx="57" cy="48" rx="4.5" ry="6.5"
		  transform="rotate(-25 57 48)" fill="#B1CC33"/>

	<!-- Feet -->
	<ellipse cx="27" cy="64" rx="6" ry="4" fill="#B1CC33"/>
	<ellipse cx="45" cy="64" rx="6" ry="4" fill="#B1CC33"/>

	<!-- Shell -->
	<ellipse cx="36" cy="47" rx="21" ry="17" fill="#5C9E31"/>
	<path d="M17.5 40 L21.5 42 M16 48 L21 48 M17.5 56 L21.5 54
	   M54.5 40 L50.5 42 M56 48 L51 48 M54.5 56 L50.5 54"
	   fill="none"/>

	<!-- Belly -->
	<ellipse cx="36" cy="48" rx="13.5" ry="14" fill="#FCEA2B"/>
	<path d="M23.6 42.5 Q36 45.5 48.4 42.5
	   M23.6 53.5 Q36 50.5 48.4 53.5
	   M36 44.3 L36 51.7"
	   fill="none"/>

	<!-- Head -->
	<circle cx="36" cy="23" r="14" fill="#B1CC33"/>
</g>

<!-- Head markings -->
<circle cx="29" cy="13.5" r="2" fill="#5C9E31"/>
<circle cx="44" cy="15" r="1.5" fill="#5C9E31"/>

<!-- Happy face -->
<circle cx="25.5" cy="27" r="2.2" fill="#E67A94"/>
<circle cx="46.5" cy="27" r="2.2" fill="#E67A94"/>
<circle cx="30" cy="22" r="2" fill="#000"/>
<circle cx="42" cy="22" r="2" fill="#000"/>
<path d="M30 28 Q36 33 42 28"
	  fill="none" stroke="#000" stroke-width="2"
	  stroke-linecap="round" stroke-linejoin="round"/>
</svg>
